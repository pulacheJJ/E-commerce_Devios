version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devioz-ecommerce-app
    container_name: devioz_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      # Ahora lee dinámicamente de tu archivo .env
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: devioz_db
    restart: unless-stopped
    environment:
      # Configura el contenedor MySQL usando tu .env
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: