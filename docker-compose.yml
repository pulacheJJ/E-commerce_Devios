version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devioz-ecommerce-app
    container_name: devioz_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ecommerce_devioz
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: devioz_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecommerce_devioz
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: